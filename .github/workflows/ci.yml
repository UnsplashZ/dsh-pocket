name: ci

# 每次推到 main / 每个 PR 都跑：
#   libs —— 两个 SwiftPM 包的单测（macOS，不需要模拟器，最快给出反馈）
#   app  —— App 层的模拟器单测 **加上** 真正走一遍未签名 IPA 的打包路径
# 打包也放进 CI 是刻意的：发布路径只有在每次改动时都被执行过，
# 打 tag 那一刻才不会第一次发现它坏了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查（本地化 / 版本号）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 440 条文案必须 zh-Hans 与 en 都有 —— 缺一条界面上就是中英混排，
      # 而这种事只有真点到那一屏才会发现，所以放 CI 里挡。
      - name: 本地化文案完整性
        run: python3 ios/scripts/gen-strings.py --check

      # 版本号的唯一真源是 ios/VERSION；project.yml 与**生成的** project.pbxproj
      # 都是它的下游。手改下游会让"包里印的版本"和"tag 上的版本"悄悄分叉，
      # 这里让它在 PR 阶段就红，而不是等发布之后。
      - name: 版本号与 project.yml / pbxproj 是否同步
        run: |
          set -euo pipefail
          bash ios/scripts/version.sh sync
          if ! git diff --quiet -- ios/project.yml ios/DSHPocket.xcodeproj/project.pbxproj; then
            echo "::error::ios/project.yml 或 project.pbxproj 里的 MARKETING_VERSION 与 ios/VERSION 不一致。"
            echo "改版本号请用： bash ios/scripts/version.sh set <X.Y.Z>"
            git diff -- ios/project.yml ios/DSHPocket.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "版本号一致：$(bash ios/scripts/version.sh get)"

  libs:
    name: 库单测（DSHKit / TetherKit）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 选 Xcode（需要 16 或更新）
        run: bash ios/scripts/select-xcode.sh

      # TetherKit 依赖 iroh-ffi（从 GitHub 拉），缓存命中时不必重新解析
      - uses: actions/cache@v4
        with:
          path: |
            ios/DSHKit/.build
            ios/TetherKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('ios/DSHKit/Package.swift', 'ios/TetherKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: DSHKit 单测（协议层，无需网络）
        working-directory: ios/DSHKit
        run: swift test

      - name: TetherKit 单测（传输层，无需网络）
        working-directory: ios/TetherKit
        run: swift test

  app:
    name: App 单测 + 未签名 IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 选 Xcode（需要 16 或更新）
        run: bash ios/scripts/select-xcode.sh

      - name: 装 xcodegen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # iroh 的预编译部件约 42 MB，键跟着 fetch-iroh.sh 走：脚本一改（版本或 sha256）
      # 缓存就自动失效，不会出现"缓存里的旧二进制 + 新的校验和"这种最难查的错配。
      - name: 缓存 iroh 预编译部件
        uses: actions/cache@v4
        with:
          path: ios/vendor
          key: iroh-${{ runner.os }}-${{ hashFiles('ios/scripts/fetch-iroh.sh') }}

      - name: App 层单测（模拟器）
        run: bash ios/build.sh --test

      - name: 打未签名 IPA（构建号用 CI 的 run number）
        run: bash ios/scripts/make-ipa.sh --build "${GITHUB_RUN_NUMBER}"

      - name: 上传 IPA
        uses: actions/upload-artifact@v7
        with:
          name: ipa-unsigned
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error

      - name: 上传构建日志（失败时排障用）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: dist/*.log
          if-no-files-found: ignore
